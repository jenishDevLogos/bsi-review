<article aria-label="இன்றைய மன்னா" style="display: flex; flex-direction: column; gap: 1.1em; font-family: {{readFont}}; font-size: {{readSize}}px; line-height: 1.85; color: #22324D;">
<div role="group" aria-label="Pastor Russell" style="display: flex; flex-direction: column; gap: 1.1em; font-family: {{strongFont}}; font-weight: 700; color: #14284B;">
<p style="margin: 0;">பிரதிஷ்டை செய்த தேவனுடைய எல்லா ஊழியக்காரர்களும் ஆட்டுக் குட்டியானவரைப் பின்பற்றுகிறவர்களான போது தங்கள் ஜீவனைப் பலியிட அர்ப்பணித்திருக்கிறார்கள். அவர்கள் இடைவிடாது தங்கள் பிரதிஷ்டையை உணர்ந்தறியக் கூடியவர்களாயிருந்தால் மட்டுமே எந்த நேரத்திலும் தேவனுடைய விருப்பம்போலும் எந்தெந்த வகையில் அல்லது வழியில் அவருடைய கிருபை அனுமதிக்குமோ அந்த வகையில் நிறைவேற்ற அவர்கள் ஆயத்தமாயிருப்பார்கள்.</p>
<p style="margin: 0;">தேவனுக்கென்று பிரதிஷ்டை செய்தவர்கள், தங்கள் பிதா அறியாமலும் அவருடைய அனுமதி இல்லாமலும் தங்கள் தலையிலுள்ள ஒரு மயிரும் விழாதென்பதை நினைவுகூர வேண்டும். தலையான நமது அருமை மீட்பர் “என் பிதா எனக்குக் கொடுத்த பாத்திரத்தில் நான் பானம் பண்ணாதிருப்பேனா?” என்று சொன்னது போல் அவர்களுடைய மனநிலையும் இருக்க வேண்டும்.</p>
<blockquote style="margin: 0.2em 0; padding: 0.2em 0 0.2em 1.1em; border-left: 3px solid #E3B55B; color: #14284B; font-family: 'Senthamil 112', 'Mukta Malar', sans-serif; font-weight: 400;">
<p style="margin: 0;">“என் தேவன் என்னை நடத்துகிறார்.<br>ஆதலால் நான் காணும் என் பங்கு ஏதானாலும் திருப்திதான்”</p>
</blockquote>
<p style="margin: 0;">என்று ஒரு கவிஞன் கூறியது போல் அவர்கள் இருதயத்தின் வாசகமும் இருக்க வேண்டும்.</p>
<p lang="en" style="margin: -0.2em 0 0; display: flex; align-items: center; gap: 12px; font-family: 'Mukta Malar', sans-serif; font-size: 16px; font-weight: 400; line-height: 1.4; color: #3F5670;"><span><span style="color: #14284B; font-weight: 600;">Pastor Russell</span>, The Watch Tower, 1904<br>Z ’04, 237 (R 3407)</span></p>
</div>
<p aria-hidden="true" style="margin: 0.2em 0; text-align: center; letter-spacing: 0.6em; color: #8B5E1A;">* * *</p>
<div role="group" aria-label="Pastor Johnson" style="display: flex; flex-direction: column; gap: 1.1em; font-family: {{johnsonFont}}; color: #22324D;">
<p style="margin: 0;">சபை முழுவதற்கும், அதன் தனிப்பட்ட ஒவ்வொரு அங்கத்தினர் சம்பந்தமாகவும் இந்த வாசகம் உண்மையானது. தமது திட்டத்தில் சம்பந்தப்பட்ட எல்லாக் காரியங்களுக்கும் தேவன் ஏற்றதோர் காலத்தை வைத்திருக்கிறார். அப்படியே சபையின் அனுபவங்களைக் குறிப்பிடும் அதிசயமான கால நிகழ்ச்சிகளை நாம் பார்க்கிறோம். இணைக்காலப் பகுதிகள் விசேஷமாக அநேக வகைகளில் இதை நிரூபிக்கிறது. குறித்தநேரம் ஒருநாள்கூடப் பிசகாமல் நுணுக்கமாகக் கண்டறியப் பட்டுள்ளது.</p>
<p style="margin: 0;">இவ்வாறு சபையின் சம்பந்தமான கால நிகழ்ச்சிகளில் எவ்வித தவறுகளுக்கும் தேவன் இடம் கொடுக்கிறதில்லை. அதன் தனிப்பட்ட அங்கத்தினர் சம்பந்தமாகவும் அவர் அதே விதமான கவனமுள்ளவராயிருக்கிறார். அவருடைய மகிமைக்கும் அவர்களுடைய நலனுக்கும் ஏற்ற நேரத்தில் ஒவ்வொரு அனுபவத்தையும், தேர்ச்சியையும், வேலையையும், சிலாக்கியத்தையும் அவர் ஒழுங்குபடுத்துகிறார்.</p>
<p lang="en" style="margin: -0.2em 0 0; display: flex; align-items: center; gap: 12px; font-family: 'Mukta Malar', sans-serif; font-size: 16px; font-weight: 400; line-height: 1.4; color: #3F5670;"><span><span style="color: #14284B; font-weight: 600;">Pastor Johnson</span>, The Present Truth, 1932<br>P ’32, 150</span></p>
</div>

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { font: 's001', size: 1, aaOpen: false, note: '', saved: false, read: false };
}
renderVals() {
const fonts = [
{ id: 's001', label: 'Senthamil 001', css: "'Senthamil 001', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 076', 'Mukta Malar', sans-serif" },
{ id: 's076', label: 'Senthamil 076', css: "'Senthamil 076', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 076', 'Mukta Malar', sans-serif" },
{ id: 's102', label: 'Senthamil 102', css: "'Senthamil 102', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 102', 'Mukta Malar', sans-serif" },
{ id: 's015', label: 'Senthamil 015', css: "'Senthamil 015', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 015', 'Mukta Malar', sans-serif" }
];
const sizes = [16, 19, 22];
const names = ['Small', 'Medium', 'Large'];
const s = this.state;
const cur = fonts.find((f) => f.id === s.font) || fonts[0];
const hasNote = s.note.trim().length > 0;
return {
aaOpen: s.aaOpen,
aaOpenStr: s.aaOpen ? 'true' : 'false',
aaBg: s.aaOpen ? '#F7F1E4' : '#FFFFFF',
toggleAa: () => this.setState({ aaOpen: !s.aaOpen }),
readFont: cur.css,
strongFont: cur.strong,
johnsonFont: cur.johnson,
readSize: sizes[s.size],
sizeName: names[s.size],
atMin: s.size === 0,
atMax: s.size === sizes.length - 1,
smaller: () => this.setState({ size: Math.max(0, s.size - 1) }),
larger: () => this.setState({ size: Math.min(sizes.length - 1, s.size + 1) }),
fontOptions: fonts.map((f) => ({
label: f.label,
css: f.css,
pressed: f.id === s.font ? 'true' : 'false',
boxStyle: f.id === s.font ? 'border: 2px solid #14284B; background: #F7F1E4;' : 'border: 1px solid #E2D9C6; background: #FFFFFF;',
pick: () => this.setState({ font: f.id })
})),
note: s.note,
onNote: (e) => this.setState({ note: e.target.value, saved: false }),
noNote: !hasNote,
saveBg: hasNote ? '#14284B' : '#9AA3B0',
save: () => { if (hasNote) this.setState({ saved: true }); },
savedMsg: s.saved ? 'Saved to My notes, linked to சங்கீதம் 31:15' : '',
toggleRead: () => this.setState({ read: !s.read }),
readStr: s.read ? 'true' : 'false',
readLabel: s.read ? 'Read today' : 'Mark today as read',
readBg: s.read ? '#14284B' : '#FFFFFF',
readFg: s.read ? '#FFFFFF' : '#14284B',
todayDot: s.read ? '●' : ' ',
todayDotLabel: s.read ? 'read' : 'not read yet'
};
}
}
</script>
