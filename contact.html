<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sent: false };
}
renderVals() {
const s = this.state;
return {
sent: s.sent,
notSent: !s.sent,
send: () => this.setState({ sent: true }),
again: () => this.setState({ sent: false })
};
}
}
</script>
