<p lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 15px; color: #3F5670; font-size: 16px;">Answered from the booklet <span lang="ta" style="font-family: 'Senthamil 001', 'Mukta Malar', sans-serif;">ஆத்துமா என்றால் என்ன?</span> · topic: <a href="questions-soul.html" lang="ta" style="font-family: 'Senthamil 001', 'Mukta Malar', sans-serif;">ஆத்துமாவும் மரணமும்</a></p>

<div style="max-width: 1240px; margin: 0 auto; padding: 40px 32px 72px; display: flex; flex-wrap: wrap; gap: 40px 56px; align-items: flex-start;">
<article aria-labelledby="ans-h" style="flex: 999 1 560px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px;">
<h2 id="ans-h" lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 22px; font-weight: 700;">Answer</h2>
<p style="margin: 0; text-indent: 1.9em; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.85; color: #22324D;">அப்படியானால், ஆத்துமா என்றால் என்ன? அது சொல்லிக்காட்ட முடியாததும் நம்மில் வாசஞ்செய்கிறதுமான ஏதோ ஒன்று என்பது ஆத்துமாவைக் குறித்துள்ள பொதுவான தப்பான அபிப்பிராயம் ஆகும். ஆனால் அது என்ன என்றும் எந்த இடத்தில் வைக்கப்பட்டிருக்கிறதென்றும் விவரிக்க முயற்சி செய்கிறவர்கள் சிலரே. அறியப்படாத இந்த ஏதோ ஒன்று உண்மையில் புத்தி நுட்பமுள்ள ஆள் என்றும், சரீரமானது அதின் வாசஸ்தலமும் அது நடத்துகிற கருவியுமானது என்றும் அநேகர் தர்க்கிக்கிறது உண்டு.</p><p style="margin: 0; text-indent: 1.9em; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.85; color: #22324D;">சிலர் சொல்லுகிறது என்னவெனில் சரீரமானது ஆத்துமா அல்ல; ஏனெனில், தேவன் ஆத்துமாவையும் சரீரத்தையும் அழிக்கவல்லவர் என்ற நமது கர்த்தருடைய வார்த்தைகள் நிருபிக்கின்றன என்று கூறுகின்றனர். இப்போதும் மனுஷ கோட்பாடுகளினால் உண்டான தப்பெண்ணங்களை நமது மனதைவிட்டு அகற்றி மனுஷ சிருஷ்டிப்பை பற்றி வேதபுத்தகம் சொல்லுவதை ஆராய்வோமானால் இவ்விஷயத்தைக் குறித்து நாம் திட்டமும் தீர்க்கமுமான அறிவை அடைவோம்.</p><p style="margin: 0; text-indent: 1.9em; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.85; color: #22324D;">ஆதி. 2:7-ல், தேவனாகிய கர்த்தர் (யேகோவா) மனுஷனைப் பூமியின் மண்ணினாலே உருவாக்கி ஜீவ சுவாசத்தை (எபிரேய பாஷையில் ஜீவிகளுடைய சுவாசம் என்றே உள்ளது. பூமியின் மீதுள்ள சகல பிராணிகளும் சுவாசிக்கிற காற்றை) அவன் நாசியிலே ஊதினார். மனுஷன் ஜீவாத்துமாவானான் [ஞானேந்திரிய (அறிவுள்ள உணர்ச்சியுள்ள) ஜீவி ஆனான்] என்று நாம் வாசிக்கிறோம்.</p><p style="margin: 0; text-indent: 1.9em; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.85; color: #22324D;">இவ்வாக்கியத்தின்படி சரீரமானது முதலில் உண்டாக்கப்பட்டது. ஆனால் அது உயிருள்ளதாக ஆகும் மட்டும் ஓர் ஆத்துமாவாகவோ ஓர் ஆளாகவோ இருந்ததில்லை. அதற்குக் கண்கள் இருந்தும் காணவில்லை, காதுகளிலிருந்தும் கேட்கவில்லை, வாய் இருந்தும் பேசவில்லை, நாக்கு இருந்தும் ருசி பார்க்கவில்லை, மூக்கு இருந்தும் முகரவில்லை, இருதயமிருந்தும் நாடி துடிக்கவில்லை.</p>

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { vote: '', saved: false };
}
renderVals() {
const s = this.state;
return {
notVoted: !s.vote,
voted: !!s.vote,
thanks: s.vote === 'yes' ? 'Thank you.' : 'Thank you. Ask a follow-up question and we will answer it.',
yes: () => this.setState({ vote: 'yes' }),
no: () => this.setState({ vote: 'no' }),
save: () => this.setState({ saved: !s.saved }),
saveLabel: s.saved ? 'Saved to My notes' : 'Save to My notes'
};
}
}
</script>
