<p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.85; color: #22324D;">சரீரம் சாகிறது என்பதும் அது தொடர்ச்சியாய் திரும்பத் திரும்பப் போஷிக்கப்பட வேண்டியதாயிருக்கிறது என்பதும், ஆகவே அது சாவாமையாகிய அழியாமையை உடையதாயிருக்க முடியாது என்பதும் யாவரும் அறிந்த விஷயங்களே. ஆனால் வேதவாக்கியங்கள் ஆத்துமாக்களைப் பற்றி அடிக்கடி தெரிவிக்கின்றன. ஆத்துமா அழிக்கப்படக் கூடாததாயிருக்குமா? ஓர் ஆத்துமாவை உண்டு பண்ணின தேவன் அதை அழிக்க முடியாதவராய் இருக்கலாமோ?</p>
