<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { idx: 0 };
}
renderVals() {
const photos = [
{ src: 'assets/img/02438eea3283154c86d6ee05507c0f01.jpg', alt: 'A brother preaching to the full hall, with his Tamil interpreter' },
{ src: 'assets/img/13ed545bc095f7226ce2d48d565c5773.jpg', alt: 'Speaker and interpreter at the lectern' },
{ src: 'assets/img/a34b990cd80134b0d7b56112ab97e342.jpg', alt: 'The congregation listening' },
{ src: 'assets/img/75329a79f9b2a948728eea92cb67d99c.jpg', alt: 'Answering questions in front of the Chart of the Ages' },
{ src: 'assets/img/eadb7138f576c3628276bbe08673e795.jpg', alt: 'The convention hall' },
{ src: 'assets/img/706fa6bdc599d7ae83b18e79ff626b4e.jpg', alt: 'Brothers and sisters following in their Bibles' },
{ src: 'assets/img/0ad93945cca14882b4146becbd1aa8e7.jpg', alt: 'The front rows' }
];
const n = photos.length;
const i = this.state.idx;
return {
cur: photos[i],
position: (i + 1) + ' of ' + n,
prev: () => this.setState({ idx: (i + n - 1) % n }),
next: () => this.setState({ idx: (i + 1) % n }),
thumbs: photos.map((p, k) => ({
src: p.src,
alt: p.alt,
pressed: k === i ? 'true' : 'false',
ring: k === i ? 'outline: 3px solid #E3B55B; outline-offset: 2px;' : '',
pick: () => this.setState({ idx: k })
}))
};
}
}
</script>
<script>DCLite.mount(typeof Component !== 'undefined' ? Component : null);</script>
