<h2 id="who-h" lang="ta" style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.3;">நாங்கள் யார்</h2>
<p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.85; color: #22324D;">லேமென்ஸ் ஹோம் மிஷனரி மூவ்மென்ட் (LHMM) ஒரு மதப்பிரிவு சாராத இயக்கம். இதில் அநேக கிறிஸ்தவர்கள் ஒன்றுசேர்ந்து ஊழியம் செய்கிறார்கள். பைபிள் ஸ்டாண்டர்ட் இந்தியா இந்த இயக்கத்தின் தமிழ் ஊழியம் ஆகும்.</p><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.85; color: #22324D;">வேதாகம சத்தியத்தைப் போதிப்பதும், கிறிஸ்துவைப் போன்ற குணத்தில் வளர உதவுவதும், தனிப்பட்ட மற்றும் கூட்டு வேதாகம ஆராய்ச்சியை ஊக்குவிப்பதும் இதன் நோக்கம்.</p><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.85; color: #22324D;">பிரயாண ஊழியர்கள் கூட்டங்களையும் வேதாகமச் செய்திகளையும் நடத்துகிறார்கள்; திருமணங்களையும் அடக்க ஆராதனைகளையும் நடத்துகிறார்கள்.</p>
</section>
