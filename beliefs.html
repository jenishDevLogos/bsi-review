<div style="max-width: 1240px; margin: 0 auto; padding: 40px 32px 72px; display: flex; flex-wrap: wrap; gap: 40px 64px; align-items: flex-start;">
<ol style="flex: 999 1 560px; min-width: 0; max-width: 800px; margin: 0; padding: 0; list-style: none; border-bottom: 1px solid #E6E1D6;"><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding: 22px 0; border-top: 1px solid #E6E1D6;"><span lang="en" aria-hidden="true" style="grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; background: #F4EBD7; color: #4A3410; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">1</span><h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">தேவன்</h3><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.8; color: #22324D;">யேகோவா என்னும் நாமத்தையுடைய தேவன் ஒருவரே உன்னதமானவர்.</p><p style="margin: 0; font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 16px;">சங். 83:18</p></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding: 22px 0; border-top: 1px solid #E6E1D6;"><span lang="en" aria-hidden="true" style="grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; background: #F4EBD7; color: #4A3410; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">2</span><h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">இயேசு</h3><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.8; color: #22324D;">இயேசு மனிதனாக வருவதற்கு முன்பே இருந்தார்; பிதா எல்லாவற்றையும் அவர் மூலமாகவே சிருஷ்டித்தார்.</p><p style="margin: 0; font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 16px;">யோவா. 1:1-3; கொலோ. 1:15-17</p></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding: 22px 0; border-top: 1px solid #E6E1D6;"><span lang="en" aria-hidden="true" style="grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; background: #F4EBD7; color: #4A3410; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">3</span><h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">உயர்த்தப்பட்ட கிறிஸ்து</h3><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.8; color: #22324D;">உயிர்த்தெழுந்தது முதல் இயேசு தெய்வீக சுபாவமுடையவர்; பிதா அவரை மிகவும் உயர்த்தினார்.</p><p style="margin: 0; font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 16px;">பிலி. 2:9-11</p></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding: 22px 0; border-top: 1px solid #E6E1D6;"><span lang="en" aria-hidden="true" style="grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; background: #F4EBD7; color: #4A3410; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">4</span><h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">பரிசுத்த ஆவி</h3><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.8; color: #22324D;">பரிசுத்த ஆவி தேவனுடைய வல்லமையும் செல்வாக்கும் ஆகும்.</p><p style="margin: 0; font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 16px;">அப். 1:8; லூக். 1:35</p></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding: 22px 0; border-top: 1px solid #E6E1D6;"><span lang="en" aria-hidden="true" style="grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; background: #F4EBD7; color: #4A3410; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">5</span><h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">மனிதனும் மரணமும்</h3><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.8; color: #22324D;">மனிதன் பூரணமாய் சிருஷ்டிக்கப்பட்டான்; பாவத்தினால் மரணத்துக்குள்ளானான். பாவத்தின் சம்பளம் நித்திய வேதனை அல்ல, மரணமே.</p><p style="margin: 0; font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 16px;">ஆதி. 1:27; ரோம. 5:12; 6:23</p></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding: 22px 0; border-top: 1px solid #E6E1D6;"><span lang="en" aria-hidden="true" style="grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; background: #F4EBD7; color: #4A3410; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">6</span><h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">ராஜ்யம்</h3><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.8; color: #22324D;">சபையும் (1,44,000 பேர்) திரள்கூட்டமும் ராஜ்யத்தின் பரலோகப் பங்காக இருக்கிறார்கள்; மூப்பரான பாத்திரவான்கள் பூமியின் பிரபுக்களாக இருப்பார்கள்.</p><p style="margin: 0; font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 16px;">வெளி. 14:1; 7:9; சங். 45:16</p></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding: 22px 0; border-top: 1px solid #E6E1D6;"><span lang="en" aria-hidden="true" style="grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; background: #F4EBD7; color: #4A3410; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">7</span><h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">எல்லாருக்கும் ஒரு வாய்ப்பு</h3><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.8; color: #22324D;">எல்லாரும் நித்திய ஜீவனைப் பெற வாய்ப்பு பெறுவார்கள்: இப்போது, அல்லது ஆயிர வருஷ யுகத்தில் உயிர்த்தெழுந்த பின்.</p><p style="margin: 0; font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 16px;">1 தீமோ. 2:4-6; யோவா. 5:28, 29</p></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 18px; padding: 22px 0; border-top: 1px solid #E6E1D6;"><span lang="en" aria-hidden="true" style="grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; background: #F4EBD7; color: #4A3410; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">8</span><h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">முடிவு காலம்</h3><p style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 19px; line-height: 1.8; color: #22324D;">நாம் இப்போது “முடிவு காலத்தில்” வாழ்கிறோம்.</p><p style="margin: 0; font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 16px;">தானி. 12:4</p></li></ol>
