<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { f: 'all', sent: false };
}
renderVals() {
const s = this.state;
const tabs = [
{ id: 'all', label: 'All', count: '9' },
{ id: 'booklets', label: 'Booklets', count: '3' },
{ id: 'tracts', label: 'Tracts', count: '5' },
{ id: 'chart', label: 'Chart', count: '1' }
];
const on = (id) => s.f === 'all' || s.f === id;
return {
tabs: tabs.map((t) => ({
label: t.label,
count: t.count,
pressed: s.f === t.id ? 'true' : 'false',
bg: s.f === t.id ? '#14284B' : '#FFFFFF',
fg: s.f === t.id ? '#FFFFFF' : '#14284B',
pick: () => this.setState({ f: t.id })
})),
showB: on('booklets'),
showT: on('tracts'),
showC: on('chart'),
sent: s.sent,
notSent: !s.sent,
send: () => this.setState({ sent: true }),
again: () => this.setState({ sent: false })
};
}
}
</script>
