<section aria-labelledby="mag-h" style="display: flex; flex-direction: column; gap: 14px;">
<h2 id="mag-h" lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 18px; font-weight: 700; color: #3F5670;">From the magazine: <span lang="ta" style="font-family: 'Senthamil 001', 'Mukta Malar', sans-serif;">வேதாகம வினா</span></h2>
<article style="border: 1px solid #E6D8B8; background: #FBF7EE; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 16px;">
<h3 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.35;">உங்கள் அழைப்பின் ஒரே நம்பிக்கை</h3>
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-weight: 600; color: #8B5E1A;">கேள்வி</span>
<p style="margin: 0; font-size: 18px; line-height: 1.8;">உங்களுக்கு உண்டான அழைப்பினாலே நீங்கள் ஒரே நம்பிக்கைக்கு அழைக்கப்பட்டிருக்கிறீர்கள் என்று வேதாகமம் சொல்வதால் (எபே. 4:4) மேலான அழைப்பு இன்னும் திறந்துதான் இருக்கிறது என்பதை இது நிரூபிக்கவில்லையா?</p>
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-weight: 600; color: #8B5E1A;">பதில்</span>
<p style="margin: 0; font-size: 18px; line-height: 1.8;">வெட்கப்படாத ஊழியக்காரர்களாக (2 தீமோ. 2:15) நாம் தேவனால் ஏற்றுக் கொள்ளப்பட வேண்டுமானால், சத்திய வார்த்தையில் நமக்கு கொடுக்கப்பட்டுள்ள தேவனுடைய நோக்கம், கருத்து மற்றும் திட்டத்தைக் கற்றுக் கொள்ளுமளவுக்கு நாம் அதை நிச்சயம் ஜாக்கிரதையாகக் கற்றுக் கொள்ள வேண்டும். அவருடைய இரகசியங்களை (சங். 25:14) நாம் அறிந்து கொள்வதால், பல்வேறான வேத வாக்கியங்களை எப்படி, எப்பொழுது, எங்கே பொருத்திப் பார்க்க வேண்டும் என்பதை அறிந்து கொள்கிறோம்.</p>
</div>

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q: '', pub: true, sent: false };
}
renderVals() {
const s = this.state;
const hasQ = s.q.trim().length > 0;
return {
q: s.q,
onQ: (e) => this.setState({ q: e.target.value }),
pub: s.pub,
togglePub: () => this.setState({ pub: !s.pub }),
noQ: !hasQ,
sendBg: hasQ ? '#14284B' : '#9AA3B0',
send: () => { if (hasQ) this.setState({ sent: true }); },
again: () => this.setState({ sent: false, q: '' }),
sent: s.sent,
notSent: !s.sent
};
}
}
</script>
<script>DCLite.mount(typeof Component !== 'undefined' ? Component : null);</script>
