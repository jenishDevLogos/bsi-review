<div style="padding: 36px 40px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E1D6; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><h3 style="margin: 0; text-align: center; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 32px;">எது சத்தியம்?</h3><span lang="en" style="font-family: 'Mukta Malar', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; color: #3F5670;">What is Truth?</span></div>
<p style="margin: 0; padding: 14px 18px; border-radius: 12px; background: #FBF7EE; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 17px; line-height: 1.75;">“வேத வாக்கியங்களெல்லாம் தேவ ஆவியினால் அருளப்பட்டிருக்கிறது. தேவனுடைய மனுஷன் தேறினவனாகவும், எந்த நற்கிரியையுஞ் செய்யத் தகுதியுள்ளவனாகவும் இருக்கும்படியாக, அவைகள் உபதேசத்துக்கும், கடிந்து கொள்ளுதலுக்கும், சீர்திருத்தலுக்கும், நீதியைப் படிப்பிக்குதலுக்கும் பிரயோஜனமுள்ளவைகளாயிருக்கிறது.” <span style="font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 15px; white-space: nowrap;">2 தீமோ. 3:16, 17</span></p>
<h4 style="margin: 6px 0 0; text-align: center; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 23px;">புத்தகங்களுக்கெல்லாம் புத்தகம்</h4>
<p style="margin: 0; text-indent: 1.9em; text-align: justify; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 18px; line-height: 1.8; color: #22324D;">“நீதியின்மேல் (சரியானதும், உண்மையானதும், நன்மையுமானவை) பசிதாகமுள்ளவர்கள் பாக்கியவான்கள், அவர்கள் (வேறு யாருமல்ல) திருப்தியடைவார்கள்.” “கேளுங்கள் அப்பொழுது உங்களுக்குக் கொடுக்கப்படும்; தேடுங்கள், அப்பொழுது கண்டடைவீர்கள்; தட்டுங்கள், அப்பொழுது உங்களுக்குத் திறக்கப்படும்.” “சத்தியத்தையும் அறிவீர்கள், சத்தியம் உங்களை (பாவம், தப்பறை, அறியாமை …) விடுதலையாக்கும்” என்று இயேசு வாக்குத்தத்தஞ் செய்கிறார். <span style="font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 15px;">(மத். 5:6; லூக். 11:9, 10; யோவா. 8:32)</span></p>
<h4 style="margin: 6px 0 0; text-align: center; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 23px;">சத்தியத்தை நாம் எங்கே கண்டுபிடிப்போம்?</h4>
<p style="margin: 0; text-indent: 1.9em; text-align: justify; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 18px; line-height: 1.8; color: #22324D;">ஆகையால், தெய்வீக சத்தியத்தை தேடுகையில், எவரும் சாத்தானால் ஏவப்பட்ட மனிதனுடைய கோட்பாடுகளிலும், விசுவாசப் பிரமாணங்களிலும் தேடக்கூடாது. சத்தியமல்லாதவையாயினும் சத்தியமென உரிமை கொண்டாடும் இவைகள் மனுஷரால் எவ்வளவு விரும்பப்பட்டவைகளாயினும் கவலையில்லை; இவைகளில் சத்தியத்தைத் தேடாது பரிசுத்த வேதாகமத்தில் தேட வேண்டும். (வேதாகமத்திலுள்ள அநேக உள்ளான, புறம்பான அத்தாட்சிகள் அது தேவனுடைய வாக்கு, சத்தியம் என நிரூபிக்கிறது.) இதைக் குறித்து இயேசு, “உம்முடைய சத்தியத்தினாலே அவர்களைப் பரிசுத்தமாக்கும்; உம்முடைய வசனமே சத்தியம்” என்று கூறினார். <span style="font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 15px;">(யோவா. 17:17; 6:63)</span></p>
