<h1 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.25;">ஆத்துமா என்றால் என்ன?</h1>

<article style="display: flex; flex-direction: column; gap: 1.1em; font-family: {{readFont}}; font-size: {{readSize}}px; line-height: 1.85; color: #22324D;">
<p style="margin: 0;">சரீரம் சாகிறது என்பதும் அது தொடர்ச்சியாய் திரும்பத் திரும்பப் போஷிக்கப்பட வேண்டியதாயிருக்கிறது என்பதும், ஆகவே அது சாவாமையாகிய அழியாமையை உடையதாயிருக்க முடியாது என்பதும் யாவரும் அறிந்த விஷயங்களே. ஆனால் வேதவாக்கியங்கள் ஆத்துமாக்களைப் பற்றி அடிக்கடி தெரிவிக்கின்றன. ஆத்துமா அழிக்கப்படக் கூடாததாயிருக்குமா? ஓர் ஆத்துமாவை உண்டு பண்ணின தேவன் அதை அழிக்க முடியாதவராய் இருக்கலாமோ?</p>
<p style="margin: 0;">ஒவ்வொரு பிராணியின் ஜீவனும் சிருஷ்டிகரின் சித்தத்திற்குக் கீழ்ப்பட்டதாயிருக்கிறது என்று நம்மிலுள்ள நீதி நியாயமே நமக்குத் தெரிவிக்கிறது. ஆத்துமா சாவாமையாகிய அழியாமையுடையது என்று வேதபுத்தகம் போதிக்கிறது என சிலர் எண்ணுவது தப்பிதமாகும். வேத புத்தக மொழி பெயர்ப்புகளிலோ அல்லது பூர்வீக மூல பாஷை எழுத்துக்களிலோ ஆத்துமா சாகக்கூடாது என ஓரிடத்திலும் சொல்லப்படவில்லை என்பதை நாம் திட்டமாய் அறிவோமாக. ஆத்துமா சாகக்கூடாதது என்று வேதபுத்தகம் சொல்லாமல் “தேவன் ஆத்துமாவையும் சரீரத்தையும் அழிக்கவல்லவர்” என்றும், <mark style="background: #F6E7B8; color: inherit; padding: 0 2px; border-radius: 3px;">“பாவம் செய்கிற ஆத்துமாவே சாகும்”</mark> என்றும் தெளிவாய்க் கூறுகிறது — மத். 10:28; எசேக். 18:4, 20.</p>
<p style="margin: 0;">சாகவும் அழிக்கப்படவும் கூடிய ஒன்று சாவாமையாகிய அழியாமையுடையதல்ல. ஆகவே ஆத்துமாக்களும் சரீரங்களும் சாவாமையாகிய அழியாமையுடையவைகள் அல்ல. அவைகள் சாகவும் அழிக்கப்படவும் கூடியவை என்பதே வேத உபதேசம் ஆகும்.</p>
<h2 style="margin: 0.6em 0 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 1.45em; line-height: 1.35; color: #14284B;">ஆத்துமாக்களைப் பற்றிய தவறான கருத்துக்கள்</h2>
<p style="margin: 0;">அப்படியானால், ஆத்துமா என்றால் என்ன? அது சொல்லிக்காட்ட முடியாததும் நம்மில் வாசஞ்செய்கிறதுமான ஏதோ ஒன்று என்பது ஆத்துமாவைக் குறித்துள்ள பொதுவான தப்பான அபிப்பிராயம் ஆகும். ஆனால் அது என்ன என்றும் எந்த இடத்தில் வைக்கப்பட்டிருக்கிறதென்றும் விவரிக்க முயற்சி செய்கிறவர்கள் சிலரே. அறியப்படாத இந்த ஏதோ ஒன்று உண்மையில் புத்தி நுட்பமுள்ள ஆள் என்றும், சரீரமானது அதின் வாசஸ்தலமும் அது நடத்துகிற கருவியுமானது என்றும் அநேகர் தர்க்கிக்கிறது உண்டு.</p>
<p style="margin: 0;">சிலர் சொல்லுகிறது என்னவெனில் சரீரமானது ஆத்துமா அல்ல; ஏனெனில், தேவன் ஆத்துமாவையும் சரீரத்தையும் அழிக்கவல்லவர் என்ற நமது கர்த்தருடைய வார்த்தைகள் நிருபிக்கின்றன என்று கூறுகின்றனர். இப்போதும் மனுஷ கோட்பாடுகளினால் உண்டான தப்பெண்ணங்களை நமது மனதைவிட்டு அகற்றி மனுஷ சிருஷ்டிப்பை பற்றி வேதபுத்தகம் சொல்லுவதை ஆராய்வோமானால் இவ்விஷயத்தைக் குறித்து நாம் திட்டமும் தீர்க்கமுமான அறிவை அடைவோம்.</p>
<h2 style="margin: 0.6em 0 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 1.45em; line-height: 1.35; color: #14284B;">மானிட ஆத்துமா எவ்வாறு படைக்கப்பட்டது?</h2>
<p style="margin: 0;">ஆதி. 2:7-ல், தேவனாகிய கர்த்தர் (யேகோவா) மனுஷனைப் பூமியின் மண்ணினாலே உருவாக்கி ஜீவ சுவாசத்தை (எபிரேய பாஷையில் ஜீவிகளுடைய சுவாசம் என்றே உள்ளது. பூமியின் மீதுள்ள சகல பிராணிகளும் சுவாசிக்கிற காற்றை) அவன் நாசியிலே ஊதினார். மனுஷன் ஜீவாத்துமாவானான் [ஞானேந்திரிய (அறிவுள்ள உணர்ச்சியுள்ள) ஜீவி ஆனான்] என்று நாம் வாசிக்கிறோம்.</p>
<p style="margin: 0;">இவ்வாக்கியத்தின்படி சரீரமானது முதலில் உண்டாக்கப்பட்டது. ஆனால் அது உயிருள்ளதாக ஆகும் மட்டும் ஓர் ஆத்துமாவாகவோ ஓர் ஆளாகவோ இருந்ததில்லை. அதற்குக் கண்கள் இருந்தும் காணவில்லை, காதுகளிலிருந்தும் கேட்கவில்லை, வாய் இருந்தும் பேசவில்லை, நாக்கு இருந்தும் ருசி பார்க்கவில்லை, மூக்கு இருந்தும் முகரவில்லை, இருதயமிருந்தும் நாடி துடிக்கவில்லை.</p>

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { font: 's001', size: 1, aaOpen: false, tab: 'notes', note: '', saved: [], ask: '', sent: false };
}
renderVals() {
const fonts = [
{ id: 's001', label: 'Senthamil 001', css: "'Senthamil 001', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 076', 'Mukta Malar', sans-serif" },
{ id: 's076', label: 'Senthamil 076', css: "'Senthamil 076', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 076', 'Mukta Malar', sans-serif" },
{ id: 's102', label: 'Senthamil 102', css: "'Senthamil 102', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 102', 'Mukta Malar', sans-serif" },
{ id: 's015', label: 'Senthamil 015', css: "'Senthamil 015', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 015', 'Mukta Malar', sans-serif" }
];
const sizes = [16, 19, 22];
const names = ['Small', 'Medium', 'Large'];
const s = this.state;
const cur = fonts.find((f) => f.id === s.font) || fonts[0];
const hasNote = s.note.trim().length > 0;
const hasAsk = s.ask.trim().length > 0;
return {
aaOpen: s.aaOpen,
aaOpenStr: s.aaOpen ? 'true' : 'false',
aaBg: s.aaOpen ? '#F7F1E4' : '#FFFFFF',
toggleAa: () => this.setState({ aaOpen: !s.aaOpen }),
readFont: cur.css,
readSize: sizes[s.size],
sizeName: names[s.size],
atMin: s.size === 0,
atMax: s.size === sizes.length - 1,
smaller: () => this.setState({ size: Math.max(0, s.size - 1) }),
larger: () => this.setState({ size: Math.min(sizes.length - 1, s.size + 1) }),
fontOptions: fonts.map((f) => ({
label: f.label,
css: f.css,
pressed: f.id === s.font ? 'true' : 'false',
boxStyle: f.id === s.font ? 'border: 2px solid #14284B; background: #F7F1E4;' : 'border: 1px solid #E2D9C6; background: #FFFFFF;',
pick: () => this.setState({ font: f.id })
})),
onNotes: s.tab === 'notes',
onAsk: s.tab === 'ask',
notesSel: s.tab === 'notes' ? 'true' : 'false',
askSel: s.tab === 'ask' ? 'true' : 'false',
notesBg: s.tab === 'notes' ? '#FFFFFF' : 'transparent',
askBg: s.tab === 'ask' ? '#FFFFFF' : 'transparent',
showNotes: () => this.setState({ tab: 'notes' }),
showAsk: () => this.setState({ tab: 'ask' }),
note: s.note,
onNote: (e) => this.setState({ note: e.target.value }),
noNote: !hasNote,
saveBg: hasNote ? '#14284B' : '#9AA3B0',
save: () => { if (hasNote) this.setState({ saved: [{ text: s.note.trim() }].concat(s.saved), note: '' }); },
saved: s.saved,
ask: s.ask,
onAskText: (e) => this.setState({ ask: e.target.value, sent: false }),
noAsk: !hasAsk,
sendBg: hasAsk ? '#14284B' : '#9AA3B0',
send: () => { if (hasAsk) this.setState({ sent: true, ask: '' }); },
sentMsg: s.sent ? 'Sent. We will reply by email.' : ''
};
}
}
</script>
<script>DCLite.mount(typeof Component !== 'undefined' ? Component : null);</script>
