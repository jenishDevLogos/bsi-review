<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { m: 9, d: 27 };
}
isRead(m, n) {
if (m < 9) return true;
if (m === 9) return n < 27 && n !== 9 && n !== 18;
return false;
}
renderVals() {
const s = this.state;
const en = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const ta = ['ஜனவரி', 'பிப்ரவரி', 'மார்ச்', 'ஏப்ரல்', 'மே', 'ஜூன்', 'ஜூலை', 'ஆகஸ்ட்', 'செப்டம்பர்', 'அக்டோபர்', 'நவம்பர்', 'டிசம்பர்'];
const first = new Date(2026, s.m, 1).getDay();
const count = new Date(2026, s.m + 1, 0).getDate();
const days = [];
let read = 0;
for (let n = 1; n <= count; n++) {
const r = this.isRead(s.m, n);
if (r) read++;
const sel = n === s.d;
const today = s.m === 9 && n === 27;
days.push({
n: String(n),
aria: n + ' ' + en[s.m] + (today ? ', today' : '') + (r ? ', read' : ''),
pressed: sel ? 'true' : 'false',
bg: sel ? '#14284B' : (r ? '#FBF7EE' : '#FFFFFF'),
fg: sel ? '#FFFFFF' : '#14284B',
ringW: today && !sel ? '2px' : '0',
dot: r ? (sel ? '#E3B55B' : '#8B5E1A') : 'transparent',
pick: () => this.setState({ d: n })
});
}
const blanks = [];
for (let i = 0; i < first; i++) blanks.push({ i: i });
const isToday = s.m === 9 && s.d === 27;
const r = this.isRead(s.m, s.d);
return {
months: en.map((name, i) => ({
label: name.slice(0, 3),
pressed: i === s.m ? 'true' : 'false',
bg: i === s.m ? '#14284B' : '#FFFFFF',
fg: i === s.m ? '#FFFFFF' : '#14284B',
border: i === s.m ? '#14284B' : '#E6E1D6',
pick: () => this.setState({ m: i, d: Math.min(s.d, new Date(2026, i + 1, 0).getDate()) })
})),
monthEn: en[s.m],
readCount: read + ' of ' + count + ' days read',
blanks: blanks,
days: days,
dayTa: s.d + ' ' + ta[s.m],
isToday: isToday,
status: isToday ? 'Today' : (r ? 'Read' : 'Not read yet')
};
}
}
</script>
<script>DCLite.mount(typeof Component !== 'undefined' ? Component : null);</script>
