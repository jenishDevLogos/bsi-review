<h1 style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.25;">நவம்பர்–டிசம்பர் 2025</h1>

<article aria-labelledby="a1" style="display: flex; flex-wrap: wrap; gap: 20px 36px; padding: 32px 0; border-top: 1px solid #E6E1D6;">

<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
<p lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 15px; font-weight: 700; color: #8B5E1A;">Pages 2–11</p>
<h3 id="a1" style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.35;"><a href="magazine-96-pages.html" style="color: #14284B; text-decoration: none;">ஆபத்தை எதிர்கொள்ளுதல்</a></h3>
<p lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 16px; color: #3F5670;">Facing Danger</p>
<p style="margin: 4px 0 0; padding: 12px 16px; border-radius: 10px; background: #FBF7EE; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 17px; line-height: 1.7; color: #14284B;">“நீங்கள் திடமனதாயிருந்து காரியங்களை நடத்துங்கள், உத்தமனுக்குக் கர்த்தர் துணை என்றான்.” <span style="font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 15px; white-space: nowrap;">2 நாளா. 19:11</span></p>
<p class="clamp3" style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 17px; line-height: 1.75; color: #22324D;">அப்போஸ்தலனாகிய பேதுரு ‘Virtue’ தைரியம் என்ற வார்த்தையை 2 பேதுரு 1:5-ல் பயன்படுத்துவதைப் போல, தைரியமானது நம்பிக்கை என்ற அர்த்தத்தில் ஒரு உயர்நிலை முதன்மை கிருபை ஆகும்; ஆனால் வீரம்/துணிவு என்ற அர்த்தத்தில் அது ஒரு இரண்டாம் நிலை கிருபை ஆகும்.</p>

<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
<p lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 15px; font-weight: 700; color: #8B5E1A;">Pages 12–16</p>
<h3 id="a2" style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.35;"><a href="#" style="color: #14284B; text-decoration: none;">நம்முடைய வார்த்தைகள் – தேவனுடைய வார்த்தைகள்</a></h3>
<p lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 16px; color: #3F5670;">Our Words – God’s Words</p>
<p style="margin: 4px 0 0; padding: 12px 16px; border-radius: 10px; background: #FBF7EE; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 17px; line-height: 1.7; color: #14284B;">“இருதயத்தின் நிறைவினால் வாய் பேசும்.” <span style="font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 15px; white-space: nowrap;">மத்தேயு 12:34</span></p>
<p class="clamp3" style="margin: 0; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 17px; line-height: 1.75; color: #22324D;">அன்பான சகோதரர்களே, மூப்பரான பாத்திரவான்கள், சிறுமந்தை, திரள்கூட்டம், வாலிபரான பாத்திரவான்கள் மற்றும் பிரதிஷ்டை செய்த எபிஃபெனி பாளையக்காரர் ஆகியோரை வளர்த்தெடுப்பதில் எழுதப்பட்ட மற்றும் பேசப்பட்ட பல வார்த்தைகளை நீங்கள் எப்போதாவது சிந்தித்திருக்கிறீர்களா?</p>
<div lang="en" style="display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 4px;">
<a href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; background: #FFFFFF; color: #14284B; border: 2px solid #14284B; font-family: 'Mukta Malar', sans-serif; font-weight: 600; font-size: 17px; text-decoration: none; box-sizing: border-box; cursor: pointer; min-height: 44px;">Read from page 12 <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12 H19 M13 6 L19 12 L13 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>

</a>
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
<p lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 15px; font-weight: 700; color: #8B5E1A;">Pages 17–20</p>
<h3 id="a3" style="margin: 0; font-family: 'Senthamil 073', 'Mukta Malar', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.35;"><a href="#" style="color: #14284B; text-decoration: none;">ஆனால் மாறுபட்ட ஒரு நோக்கத்துடன்</a></h3>
<p lang="en" style="margin: 0; font-family: 'Mukta Malar', sans-serif; font-size: 16px; color: #3F5670;">But with a Changed Purpose</p>
<p style="margin: 4px 0 0; padding: 12px 16px; border-radius: 10px; background: #FBF7EE; font-family: 'Senthamil 001', 'Mukta Malar', sans-serif; font-size: 17px; line-height: 1.7; color: #14284B;">“… என் புறாவோ, என் உத்தமியோ (கறைபடாதவள்) ஒருத்தியே; அவள் தன் தாய்க்கு ஒரே பிள்ளை …” <span style="font-family: 'Senthamil 102', 'Mukta Malar', sans-serif; color: #4A3410; font-size: 15px; white-space: nowrap;">உன்னதப்பாட்டு 6:8,9</span></p>
