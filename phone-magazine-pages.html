<h1 class="mz-title">ஆபத்தை எதிர்கொள்ளுதல்</h1>
<p class="mz-sub" lang="en">Facing Danger</p>
<p class="mz-epi">“நீங்கள் திடமனதாயிருந்து காரியங்களை நடத்துங்கள், உத்தமனுக்குக் கர்த்தர் துணை என்றான்.” <span class="mz-ref">(2 நாளா. 19:11)</span></p>

<article class="mz-art" style="display: flex; flex-direction: column; gap: 0.55em; font-family: {{readFont}}; font-size: {{readSize}}px; line-height: 1.7; color: #1B2433;">
<p class="mz-first" style="margin: 0;"><span class="mz-drop" aria-hidden="true">அ</span><span class="mz-sr">அ</span>ப்போஸ்தலனாகிய பேதுரு ‘Virtue’ தைரியம் என்ற வார்த்தையை 2 பேதுரு 1:5-ல் பயன்படுத்துவதைப் போல, தைரியமானது நம்பிக்கை என்ற அர்த்தத்தில் ஒரு உயர்நிலை முதன்மை கிருபை ஆகும்; ஆனால் வீரம்/துணிவு என்ற அர்த்தத்தில் அது ஒரு இரண்டாம் நிலை கிருபை ஆகும்; அந்த வகையில் இது உயர்நிலை முதன்மை கிருபைகள் ஒருவனைக் கட்டுப்படுத்தும் ஜாக்கிரதையுணர்வு அல்லது பயத்தின் முயற்சிகளை அடக்குவதால் உருவாகிறது. ஆகையால் நமது பாடத்தில் இதனை ஒரு இரண்டாம் நிலை கிருபையாகவே விவரிக்க விரும்புகிறோம்.</p>
<p style="margin: 0;">மிகைப்படுத்தப்பட்ட எச்சரிக்கையுணர்வு, பயத்தின் ஆவி, மனித குடும்பத்தில் பலரை எவ்வாறு கட்டுப்படுத்துகிறது என்பதையும், தேவனுடைய ஜனங்கள் அநேகருடைய விஷயத்தில் எப்படி வாழ்நாள் முழுவதும் அதனுடன் போராட வேண்டியதிருக்கிறது என்பதையும் நாம் கருத்தில் கொள்ளும்போது, அதற்கு நேர்மாறான துணிச்சல்/வீரம் என்ற கருத்தில் தைரியமானது, தேவனுடைய ஜனங்கள் கற்றுக் கொள்ளவும் மற்றும் நடைமுறைப்படுத்தவும் தகுதியான பாடமாயிருக்கும் என்று அறிந்து கொள்ளப்படும்.</p>
<p style="margin: 0;">ஆனால் மற்ற பல கிருபைகளைப் போலவே, தைரியத்திலும் போலியானவைகள் உள்ளன, பெரும்பாலும் அவையே அதன் உண்மையான பொருளாகக் கருதப்படுகின்றன. அத்தகைய போலியானவைகளில் ஒன்று ‘அதீதத் துணிவாக’ இருக்கிறது, அது “தேவதூதர்கள் காலடி வைக்க அஞ்சுகிற இடத்திலும் விரைந்து செல்லும்” இயல்புடைய மனப்பான்மையாகும்.</p>

<figure class="mz-fig"><figcaption class="mz-figcap">பயத்தை மேற்கொள்ளும் விசுவாசம்</figcaption><img src="assets/img/a104e741b99348ddf2cc8e8e11867987.jpg" alt="A lion standing in tall grass on the savanna"></figure>

<h2 class="mz-h">தைரியத்தின் விளக்கம்</h2>
<p style="margin: 0;">அதீத துணிவு, அசட்டுத் துணிவு, அனுமானம், தற்பெருமை பேசுதல் ஆகியவற்றை தைரியம் என்று புரிந்து கொள்ளப்பட வேண்டும் என்று வேதாகமம் கருதவில்லை என்றால், உண்மையில் தைரியம் என்றால் என்ன? <mark style="background: #F6E7B8; color: inherit; padding: 0 2px; border-radius: 3px;">இதனை ஆபத்தான சூழ்நிலையின் முன்னிலையில் மனம், இருதயம் மற்றும் சித்தத்தின் நிதானமான, அச்சமற்ற, துணிச்சலான மற்றும் சுயத்தை-மறக்கும் மனப்பான்மை என்று வரையறுக்கலாம்.</mark></p>
<p style="margin: 0;">உதாரணமாக, உண்பது, குளிப்பது, உடுப்பது, தூங்குவது போன்றவற்றை யார் தைரியமான செயல்கள் என்று நினைப்பார்கள்? அவை தைரியமான செயல்களாகக் கருதப்படாததற்கான காரணம், பொதுவாக ஆபத்து அவற்றுடன் தொடர்புபடுத்தப்படவில்லை என்பதாகும்.</p>

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { font: 's001', size: 1, sheet: 'aa', note: '', saved: [] };
}
renderVals() {
const fonts = [
{ id: 's001', label: 'Senthamil 001', css: "'Senthamil 001', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 076', 'Mukta Malar', sans-serif" },
{ id: 's076', label: 'Senthamil 076', css: "'Senthamil 076', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 076', 'Mukta Malar', sans-serif" },
{ id: 's102', label: 'Senthamil 102', css: "'Senthamil 102', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 102', 'Mukta Malar', sans-serif" },
{ id: 's015', label: 'Senthamil 015', css: "'Senthamil 015', 'Mukta Malar', sans-serif", strong: "'Senthamil 001', 'Mukta Malar', sans-serif", johnson: "'Senthamil 015', 'Mukta Malar', sans-serif" }
];
const sizes = [16, 19, 22];
const names = ['Small', 'Medium', 'Large'];
const s = this.state;
const cur = fonts.find((f) => f.id === s.font) || fonts[0];
const hasNote = s.note.trim().length > 0;
const isAa = s.sheet === 'aa';
const isNote = s.sheet === 'note';
return {
showAa: isAa,
showNote: isNote,
aaStr: isAa ? 'true' : 'false',
noteStr: isNote ? 'true' : 'false',
aaBg: isAa ? '#F7F1E4' : '#FFFFFF',
aaBorder: isAa ? '#14284B' : '#DCD3C0',
noteBg: isNote ? '#F7F1E4' : '#FFFFFF',
noteBorder: isNote ? '#14284B' : '#DCD3C0',
noteCount: s.saved.length ? ' · ' + s.saved.length : '',
openAa: () => this.setState({ sheet: isAa ? null : 'aa' }),
openNote: () => this.setState({ sheet: isNote ? null : 'note' }),
closeSheet: () => this.setState({ sheet: null }),
readFont: cur.css,
readSize: sizes[s.size],
sizeName: names[s.size],
atMin: s.size === 0,
atMax: s.size === sizes.length - 1,
smaller: () => this.setState({ size: Math.max(0, s.size - 1) }),
larger: () => this.setState({ size: Math.min(sizes.length - 1, s.size + 1) }),
fontOptions: fonts.map((f) => ({
label: f.label,
css: f.css,
pressed: f.id === s.font ? 'true' : 'false',
boxStyle: f.id === s.font ? 'border: 2px solid #14284B; background: #F7F1E4;' : 'border: 1px solid #E2D9C6; background: #FFFFFF;',
pick: () => this.setState({ font: f.id })
})),
note: s.note,
onNote: (e) => this.setState({ note: e.target.value }),
noNote: !hasNote,
saveBg: hasNote ? '#14284B' : '#9AA3B0',
save: () => { if (hasNote) this.setState({ saved: [{ text: s.note.trim() }].concat(s.saved), note: '' }); },
saved: s.saved
};
}
}
</script>
<script>DCLite.mount(typeof Component !== 'undefined' ? Component : null);</script>
