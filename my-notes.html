{ id: 'qs', label: 'Questions', count: '2' },
{ id: 'read', label: 'Reading', count: '' }
];
return {
tabs: tabs.map((t) => ({
label: t.label,
count: t.count,
sel: s.tab === t.id ? 'true' : 'false',
bg: s.tab === t.id ? '#FFFFFF' : 'transparent',
fw: s.tab === t.id ? '700' : '500',
sh: s.tab === t.id ? '0 1px 2px rgba(20,40,75,0.12)' : 'none',
pick: () => this.setState({ tab: t.id })
})),
onNotes: s.tab === 'notes',
onHigh: s.tab === 'high',
onQs: s.tab === 'qs',
onRead: s.tab === 'read'
};
}
}
</script>
<script>DCLite.mount(typeof Component !== 'undefined' ? Component : null);</script>
