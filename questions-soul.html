<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: 0 };
}
renderVals() {
const qs = [
{ t: 'ஆத்துமா என்றால் என்ன?', a: 'அப்படியானால், ஆத்துமா என்றால் என்ன? அது சொல்லிக்காட்ட முடியாததும் நம்மில் வாசஞ்செய்கிறதுமான ஏதோ ஒன்று என்பது ஆத்துமாவைக் குறித்துள்ள பொதுவான தப்பான அபிப்பிராயம் ஆகும்.', src: 'Answered in the booklet ஆத்துமா என்றால் என்ன?, 12 pages', href: 'answer-what-is-the-soul.html' },
{ t: 'ஆத்துமா அழிக்கப்படக் கூடாததாயிருக்குமா?', a: 'சாகவும் அழிக்கப்படவும் கூடிய ஒன்று சாவாமையாகிய அழியாமையுடையதல்ல. ஆகவே ஆத்துமாக்களும் சரீரங்களும் சாவாமையாகிய அழியாமையுடையவைகள் அல்ல. அவைகள் சாகவும் அழிக்கப்படவும் கூடியவை என்பதே வேத உபதேசம் ஆகும்.', src: 'Answered in the booklet ஆத்துமா என்றால் என்ன?', href: 'answer-what-is-the-soul.html' },
{ t: 'மரித்தோர் எங்கே?', a: 'நமது அன்பர்கள், நமது அயலகத்தார்: நல்லார், பொல்லார், உயர்ந்தோர், தாழ்ந்தோர் முதலானோர் எங்கே இருக்கிறார்கள்?', src: 'Answered in the booklet மரித்தோர் எங்கே?', href: '#' },
{ t: 'நரகத்தில் ஐசுவரியவன் - அவன் எப்பொழுதாவது திரும்ப வருவானா?', a: 'லூக்கா 16-ஆம் அதிகாரத்தில் உள்ள ஐசுவரியவனையும் லாசருவையும் பற்றிய உவமையின் விளக்கம்.', src: 'Answered in a tract, short read', href: '#' }
];
const o = this.state.open;
return {
qs: qs.map((q, i) => ({
t: q.t, a: q.a, src: q.src, href: q.href,
isOpen: i === o,
open: i === o ? 'true' : 'false',
sign: i === o ? '−' : '+',
bg: i === o ? '#FBF7EE' : '#FFFFFF',
toggle: () => this.setState({ open: i === o ? -1 : i })
}))
};
}
}
